name: Issue 84 real browser regression
on:
  push:
    branches:
      - test/issue-84-real-browser
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out actual NagVis module
        uses: actions/checkout@v4
      - name: Validate reproduction harness before provisioning
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/issue64-actual-stack.sh
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tests/issue64-actual-stack.sh').read_text()
          lines = source.splitlines()
          first = lines.index("python3 - <<'PY'") + 1
          last = lines.index("PY", first)
          body = chr(10).join(lines[first:last])
          compile(body, 'issue64-setup.py', 'exec')
          print('Shell and embedded Python syntax valid')
          PY
      - name: Install actual Icinga Web 2 and NagVis packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          apt-cache policy icingaweb2 nagvis | tee ${RUNNER_TEMP}/package-candidates.txt
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            apache2 libapache2-mod-php icingaweb2 icingacli nagvis nagvis-demos \
            php-gd php-mbstring php-intl php-curl php-sqlite3 curl
      - name: Install integration module after Apache starts
        shell: bash
        run: |
          set -euxo pipefail
          sudo systemctl start apache2
          if ! sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y icingaweb2-module-nagvis; then
            echo 'Module package postinst failed; collecting diagnostics'
            dpkg-query -s icingaweb2-module-nagvis || true
            sudo cat /var/lib/dpkg/info/icingaweb2-module-nagvis.postinst || true
            sudo icingacli module list || true
          fi
          test -f /usr/share/icingaweb2/modules/nagvis/module.info
      - name: Inspect real installed services, module and routes
        shell: bash
        run: |
          set -euxo pipefail
          {
            date -u
            php -v
            dpkg-query -W icingaweb2 nagvis apache2 icingaweb2-module-nagvis
            dpkg -L nagvis | grep -E '(index.php|nagvis.ini.php|apache|config)' | head -70
            ls -la /usr/share/icingaweb2/modules/
            find /etc/apache2 -maxdepth 2 -type f -name '*nagvis*' -o -name '*icinga*'
            echo '--- APACHE ROUTES ---'
            cat /etc/apache2/conf-available/icingaweb2.conf /etc/apache2/conf-available/nagvis.conf
            echo '--- NAGVIS MAIN CONFIG NONSECRET FIELDS ---'
            grep -E '^(authmodule|authorisationmodule|logonmodule|headermenu|mapurl|htmlcgi|baseurl)' /etc/nagvis/nagvis.ini.php || true
            echo '--- NAGVIS ENTRY FILE ---'
            sed -n '1,50p' /usr/share/nagvis/share/server/core/functions/core.php
            echo '--- MODULE INFO ---'
            cat /usr/share/icingaweb2/modules/nagvis/module.info
            sudo apache2ctl -t
          } 2>&1 | tee ${RUNNER_TEMP}/stack-inspection.log
          sudo systemctl start apache2
          for uri in / /icingaweb2 /nagvis /nagvis/frontend/nagvis-js/index.php; do
            name="$(printf '%s' "$uri" | tr '/' '_')"
            curl -sS --max-time 15 -D "${RUNNER_TEMP}/headers${name}.txt" \
              -o "${RUNNER_TEMP}/body${name}.html" \
              -w "URI $uri HTTP %{http_code} effective=%{url_effective}\\n" \
              "http://127.0.0.1$uri" || true
          done
      - name: Configure actual Icinga Web module and inspect real responses
        shell: bash
        run: |
          sudo --preserve-env=RUNNER_TEMP bash tests/issue64-actual-stack.sh
      - name: Install Chromium browser for real-app navigation
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright
          npx playwright install chromium
      - name: Check real Icinga and NagVis pages with correct Apache routing
        shell: bash
        run: |
          set -euo pipefail
          node tests/issue64-browser.js correct
      - name: Create second real NagVis demo map and fetch tested revisions
        shell: bash
        run: |
          set -euxo pipefail
          map="$(sudo find /etc/nagvis /usr/share/nagvis /var/lib/nagvis -type f -name 'demo-overview.cfg' -print -quit 2>/dev/null || true)"
          test -n "$map"
          sudo cp -p "$map" "$(dirname "$map")/issue84-second.cfg"
          sudo ls -l "$map" "$(dirname "$map")/issue84-second.cfg"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/fix/issue-39-sync-map-navigation:refs/remotes/origin/fix/issue-39-sync-map-navigation
          git rev-parse origin/main origin/fix/issue-39-sync-map-navigation
          test "$(git rev-parse origin/fix/issue-39-sync-map-navigation)" = "6f484376977c82f3764ef64c726ff998919bc2c1"
      - name: Reproduce issue 39 NagVis defaults and documented map-object route
        shell: bash
        run: |
          set -euxo pipefail
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          import time
          config = Path('/etc/nagvis/nagvis.ini.php')
          source = config.read_text()
          source = re.sub(r'(?m)^\\s*(?:headermenu|urltarget|mapurl|htmlcgi)\\s*=[^\\n]*\\n', '', source)
          for section in ('paths','defaults'):
              if not re.search(r'(?m)^\\[' + section + r'\\]\\s*        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:public/js/module.js \
            | sudo tee /usr/share/icingaweb2/modules/nagvis/public/js/module.js >/dev/null
          node --check /usr/share/icingaweb2/modules/nagvis/public/js/module.js
          node tests/issue84-browser.js baseline
          node tests/issue84-real-ui-click.js baseline
          node tests/issue84-sidebar-toggle.js baseline
          node tests/issue84-map-icon-link.js baseline
          node tests/issue84-encoded-real-map.js baseline
      - name: Browser regression with exact PR 84 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          git show origin/fix/issue-39-sync-map-navigation:public/js/module.js \
            | sudo tee /usr/share/icingaweb2/modules/nagvis/public/js/module.js >/dev/null
          node --check /usr/share/icingaweb2/modules/nagvis/public/js/module.js
          node tests/issue84-browser.js pr84
          node tests/issue84-real-ui-click.js pr84
          node tests/issue84-sidebar-toggle.js pr84
          node tests/issue84-map-icon-link.js pr84
          node tests/issue84-encoded-real-map.js pr84
      - name: Capture Apache and NagVis authorization diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          sudo tail -n 150 /var/log/apache2/error.log | tee "$RUNNER_TEMP/issue84-apache-errors.log" || true
          sudo cat /tmp/issue84-auth-events | tee "$RUNNER_TEMP/issue84-auth-events.log" || true
          sudo grep -nE '^(authmodule|authorisationmodule|logonmodule|headermenu|mapurl|urltarget)[[:space:]]*=' /etc/nagvis/nagvis.ini.php | tee "$RUNNER_TEMP/issue84-nagvis-config.log" || true
      - name: Upload actual stack diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-84-real-browser-diagnostics
          path: |
            ${{ runner.temp }}/package-candidates.txt
            ${{ runner.temp }}/stack-inspection.log
            ${{ runner.temp }}/headers*.txt
            ${{ runner.temp }}/body*.html
            ${{ runner.temp }}/actual-*.html
            ${{ runner.temp }}/actual-*-headers.txt
            ${{ runner.temp }}/correct.png
            ${{ runner.temp }}/correct.json
            ${{ runner.temp }}/issue84-*.json
            ${{ runner.temp }}/issue84-*.png
            ${{ runner.temp }}/issue84-mapicon-*.json
            ${{ runner.temp }}/issue84-sidebar-*.json
            ${{ runner.temp }}/issue84-click-*.json
            ${{ runner.temp }}/issue84-click-*.png
            ${{ runner.temp }}/issue84-encoded-*.json
            ${{ runner.temp }}/issue84-encoded-*.png
            ${{ runner.temp }}/issue84-unauthorized-*.png
            ${{ runner.temp }}/issue84-apache-errors.log
            ${{ runner.temp }}/issue84-auth-events.log
            ${{ runner.temp }}/issue84-nagvis-config.log
          if-no-files-found: warn
